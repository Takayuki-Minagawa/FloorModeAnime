name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify generated Test0202 manifest
        run: npm run sample:manifest && git diff --exit-code -- public/Sample/Test0202_manifest.json

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
